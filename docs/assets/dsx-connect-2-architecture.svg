<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img" aria-labelledby="t d">
  <title id="t">DSX-Connect 2 architecture</title>
  <desc id="d">Repositories connect to connectors. Connectors register with the DSX-Connect API and serve file reads and remediation for workers. The API stores jobs and an outbox in PostgreSQL; a relay publishes work to RabbitMQ; scan, policy, remediation, result sink and DIANNA workers process it, call DSXA for verdicts, and emit results.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <style>
      text { font-family: Roboto, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }
      .h { font-size: 15px; font-weight: 600; }
      .h-sm { font-size: 14px; font-weight: 600; }
      .sub { font-size: 11.5px; fill: #52606d; }
      .chip { font-size: 12.5px; font-weight: 500; }
      .lbl { font-size: 10.5px; fill: #52606d; }
      .step { font-size: 12px; fill: #323f4b; }
      .badge-t { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .line { stroke: #52606d; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1240" height="680" rx="14" fill="#ffffff"/>

  <!-- Applications and operators -->
  <rect x="600" y="20" width="300" height="58" rx="10" fill="#f3f4f6" stroke="#9aa5b1"/>
  <text class="h" x="750" y="45" text-anchor="middle">Applications and operators</text>
  <text class="sub" x="750" y="64" text-anchor="middle">Operator Console · REST API · file gateway clients</text>
  <line class="line" x1="750" y1="78" x2="750" y2="138" marker-end="url(#arrow)"/>

  <!-- Repositories -->
  <rect x="20" y="140" width="190" height="500" rx="12" fill="#f5f6f8" stroke="#7b8794"/>
  <text class="h" x="115" y="168" text-anchor="middle">Repositories</text>
  <rect x="34" y="186" width="162" height="56" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text class="chip" x="115" y="209" text-anchor="middle">Cloud object storage</text>
  <text class="sub" x="115" y="228" text-anchor="middle">GCS · Amazon S3</text>
  <rect x="34" y="252" width="162" height="56" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text class="chip" x="115" y="275" text-anchor="middle">File shares</text>
  <text class="sub" x="115" y="294" text-anchor="middle">NFS · SMB · local volumes</text>
  <rect x="34" y="318" width="162" height="56" rx="8" fill="#ffffff" stroke="#9aa5b1"/>
  <text class="chip" x="115" y="341" text-anchor="middle">SaaS and collaboration</text>
  <text class="sub" x="115" y="360" text-anchor="middle">SharePoint · OneDrive · M365</text>
  <text class="sub" x="115" y="410" text-anchor="middle">Repository credentials</text>
  <text class="sub" x="115" y="426" text-anchor="middle">stay with the connectors.</text>

  <line class="line" x1="212" y1="214" x2="238" y2="214" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="line" x1="212" y1="280" x2="238" y2="280" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="line" x1="212" y1="346" x2="238" y2="346" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- Connectors -->
  <rect x="240" y="140" width="180" height="500" rx="12" fill="#edf7ee" stroke="#2e7d32"/>
  <text class="h" x="330" y="168" text-anchor="middle">Connectors</text>
  <rect x="254" y="186" width="152" height="32" rx="8" fill="#ffffff" stroke="#66bb6a"/>
  <text class="chip" x="330" y="207" text-anchor="middle">Google Cloud Storage</text>
  <rect x="254" y="226" width="152" height="32" rx="8" fill="#ffffff" stroke="#66bb6a"/>
  <text class="chip" x="330" y="247" text-anchor="middle">AWS S3</text>
  <rect x="254" y="266" width="152" height="32" rx="8" fill="#ffffff" stroke="#66bb6a"/>
  <text class="chip" x="330" y="287" text-anchor="middle">Filesystem</text>
  <rect x="254" y="306" width="152" height="32" rx="8" fill="#ffffff" stroke="#66bb6a" stroke-dasharray="4 3"/>
  <text class="chip" x="330" y="327" text-anchor="middle">More connectors</text>
  <text class="step" x="258" y="382">• Register and heartbeat</text>
  <text class="step" x="258" y="404">• Discover assets</text>
  <text class="step" x="258" y="426">• Monitor change events</text>
  <text class="step" x="258" y="448">• Read file content</text>
  <text class="step" x="258" y="470">• Remediate</text>
  <text class="step" x="258" y="492">• Deliver files (write)</text>

  <!-- Connectors <-> API -->
  <line class="line" x1="422" y1="172" x2="518" y2="172" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="461" y="152" text-anchor="middle">register</text>
  <text class="lbl" x="461" y="164" text-anchor="middle">events</text>

  <!-- Workers -> Connectors -->
  <line class="line" x1="518" y1="527" x2="422" y2="527" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="461" y="507" text-anchor="middle">read</text>
  <text class="lbl" x="461" y="519" text-anchor="middle">remediate</text>

  <!-- DSX-Connect core -->
  <rect x="500" y="100" width="500" height="560" rx="14" fill="#eef7fd" stroke="#0288d1" stroke-width="1.5"/>
  <text x="520" y="126" style="font-size:16px;font-weight:700;fill:#0277bd">DSX-Connect</text>

  <rect x="520" y="140" width="460" height="64" rx="10" fill="#ffffff" stroke="#0288d1"/>
  <text class="h" x="750" y="166" text-anchor="middle">DSX-Connect API</text>
  <text class="sub" x="750" y="186" text-anchor="middle">control plane · execution · file gateway · Operator Console</text>

  <!-- PostgreSQL cylinder -->
  <path d="M520,262 v66 a105,10 0 0 0 210,0 v-66" fill="#ffffff" stroke="#0288d1"/>
  <ellipse cx="625" cy="262" rx="105" ry="10" fill="#ffffff" stroke="#0288d1"/>
  <text class="h-sm" x="625" y="296" text-anchor="middle">PostgreSQL</text>
  <text class="sub" x="625" y="316" text-anchor="middle">jobs · items · scopes · outbox</text>
  <line class="line" x1="625" y1="206" x2="625" y2="248" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect x="770" y="256" width="210" height="76" rx="10" fill="#ffffff" stroke="#0288d1"/>
  <text class="h-sm" x="875" y="290" text-anchor="middle">Relay</text>
  <text class="sub" x="875" y="310" text-anchor="middle">publishes outbox to RabbitMQ</text>
  <line class="line" x1="732" y1="294" x2="768" y2="294" marker-end="url(#arrow)"/>

  <rect x="560" y="376" width="420" height="58" rx="10" fill="#ffffff" stroke="#0288d1"/>
  <text class="h-sm" x="770" y="400" text-anchor="middle">RabbitMQ</text>
  <text class="sub" x="770" y="420" text-anchor="middle">work queues · retries · dead-letter queues</text>
  <line class="line" x1="875" y1="332" x2="875" y2="374" marker-end="url(#arrow)"/>

  <rect x="520" y="470" width="460" height="170" rx="10" fill="#ffffff" stroke="#0288d1"/>
  <text class="h-sm" x="538" y="494">Workers</text>
  <line class="line" x1="770" y1="434" x2="770" y2="468" marker-end="url(#arrow)"/>
  <rect x="528" y="510" width="84" height="34" rx="8" fill="#e1f5fe" stroke="#4fc3f7"/>
  <text class="chip" x="570" y="532" text-anchor="middle">Scan</text>
  <rect x="618" y="510" width="84" height="34" rx="8" fill="#e1f5fe" stroke="#4fc3f7"/>
  <text class="chip" x="660" y="532" text-anchor="middle">Policy</text>
  <rect x="708" y="510" width="84" height="34" rx="8" fill="#e1f5fe" stroke="#4fc3f7"/>
  <text class="chip" x="750" y="532" text-anchor="middle">Remediation</text>
  <rect x="798" y="510" width="84" height="34" rx="8" fill="#e1f5fe" stroke="#4fc3f7"/>
  <text class="chip" x="840" y="532" text-anchor="middle">Result sink</text>
  <rect x="888" y="510" width="84" height="34" rx="8" fill="#e1f5fe" stroke="#4fc3f7" stroke-dasharray="4 3"/>
  <text class="chip" x="930" y="532" text-anchor="middle">DIANNA</text>
  <text class="sub" x="538" y="576">Each stage runs in its own pods and scales independently.</text>
  <text class="sub" x="538" y="596">Stage results are written back to PostgreSQL.</text>

  <!-- Workers -> PostgreSQL (state) -->
  <line class="line" x1="540" y1="468" x2="540" y2="340" marker-end="url(#arrow)"/>
  <text class="lbl" x="532" y="410" text-anchor="middle" transform="rotate(-90 532 410)">state</text>

  <!-- External services -->
  <rect x="1060" y="470" width="170" height="52" rx="10" fill="#fff8e1" stroke="#f57f17"/>
  <text class="h-sm" x="1145" y="492" text-anchor="middle">DSXA</text>
  <text class="sub" x="1145" y="510" text-anchor="middle">malware verdicts</text>
  <line class="line" x1="982" y1="496" x2="1058" y2="496" marker-end="url(#arrow)"/>
  <text class="lbl" x="1020" y="489" text-anchor="middle">scan</text>

  <rect x="1060" y="532" width="170" height="52" rx="10" fill="#fff8e1" stroke="#f57f17" stroke-dasharray="4 3"/>
  <text class="h-sm" x="1145" y="554" text-anchor="middle">DIANNA</text>
  <text class="sub" x="1145" y="572" text-anchor="middle">AI analysis (optional)</text>
  <line class="line" x1="982" y1="558" x2="1058" y2="558" marker-end="url(#arrow)"/>
  <text class="lbl" x="1020" y="551" text-anchor="middle">analyze</text>

  <rect x="1060" y="594" width="170" height="56" rx="10" fill="#fff8e1" stroke="#f57f17"/>
  <text class="h-sm" x="1145" y="616" text-anchor="middle">Result destinations</text>
  <text class="sub" x="1145" y="634" text-anchor="middle">stdout · JSON lines · SIEM</text>
  <line class="line" x1="982" y1="622" x2="1058" y2="622" marker-end="url(#arrow)"/>
  <text class="lbl" x="1020" y="615" text-anchor="middle">results</text>

  <!-- Scan flow legend -->
  <text class="h-sm" x="1040" y="160">Scan flow</text>
  <g>
    <circle cx="1050" cy="186" r="9" fill="#f57f17"/><text class="badge-t" x="1050" y="190" text-anchor="middle">1</text>
    <text class="step" x="1066" y="190">Request or change event</text>
    <text class="step" x="1066" y="205">reaches the API</text>
    <circle cx="1050" cy="230" r="9" fill="#f57f17"/><text class="badge-t" x="1050" y="234" text-anchor="middle">2</text>
    <text class="step" x="1066" y="234">Job, items and outbox</text>
    <text class="step" x="1066" y="249">committed to PostgreSQL</text>
    <circle cx="1050" cy="274" r="9" fill="#f57f17"/><text class="badge-t" x="1050" y="278" text-anchor="middle">3</text>
    <text class="step" x="1066" y="278">Relay publishes work</text>
    <text class="step" x="1066" y="293">to RabbitMQ</text>
    <circle cx="1050" cy="318" r="9" fill="#f57f17"/><text class="badge-t" x="1050" y="322" text-anchor="middle">4</text>
    <text class="step" x="1066" y="322">Scan worker reads content</text>
    <text class="step" x="1066" y="337">through the connector</text>
    <circle cx="1050" cy="362" r="9" fill="#f57f17"/><text class="badge-t" x="1050" y="366" text-anchor="middle">5</text>
    <text class="step" x="1066" y="366">DSXA returns a verdict</text>
    <circle cx="1050" cy="392" r="9" fill="#f57f17"/><text class="badge-t" x="1050" y="396" text-anchor="middle">6</text>
    <text class="step" x="1066" y="396">Policy decides; remediation</text>
    <text class="step" x="1066" y="411">and results follow</text>
  </g>

  <!-- Step badges on the diagram -->
  <circle cx="520" cy="140" r="9" fill="#f57f17"/><text class="badge-t" x="520" y="144" text-anchor="middle">1</text>
  <circle cx="520" cy="262" r="9" fill="#f57f17"/><text class="badge-t" x="520" y="266" text-anchor="middle">2</text>
  <circle cx="893" cy="353" r="9" fill="#f57f17"/><text class="badge-t" x="893" y="357" text-anchor="middle">3</text>
  <circle cx="528" cy="510" r="9" fill="#f57f17"/><text class="badge-t" x="528" y="514" text-anchor="middle">4</text>
  <circle cx="1060" cy="470" r="9" fill="#f57f17"/><text class="badge-t" x="1060" y="474" text-anchor="middle">5</text>
  <circle cx="618" cy="510" r="9" fill="#f57f17"/><text class="badge-t" x="618" y="514" text-anchor="middle">6</text>
</svg>
