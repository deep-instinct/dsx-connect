<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
<title id="title">Monitor repositories, run full scans, and upload through the File Gateway</title>
<desc id="desc">Repositories connect through connectors and applications upload through gateway access. DSX-Connect supports Monitoring, Full Scans, and File Gateway workflows using DSX for Applications for malware scanning and optional DIANNA follow-up analysis.</desc>
<defs>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#3a7796" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#28455a" flood-opacity=".10"/></filter>
  <style>text{font-family:Arial,sans-serif;fill:#243b53}.title{font-size:29px;font-weight:700}.head{font-size:21px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:15px;fill:#526779}.tiny{font-size:13px;fill:#526779}.line{fill:none;stroke:#3a7796;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.icon{fill:none;stroke:#3a7796;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style>
</defs>
<rect width="1200" height="540" rx="26" fill="#fff"/>
<path d="M325 115 Q620 45 850 140 Q995 315 848 510 Q570 585 324 492 Q210 310 325 115" fill="#f1f8fc"/>
<text x="600" y="48" text-anchor="middle" class="title">Protect files wherever work happens.</text>
<text x="600" y="76" text-anchor="middle" class="small">Monitor changes. Scan existing content. Give applications a File Gateway.</text>

<!-- Repositories: deliberately friendly, simple drawn icons. -->
<g filter="url(#shadow)"><rect x="30" y="135" width="230" height="184" rx="24" fill="#eef8f0" stroke="#82b592" stroke-width="2"/></g>
<path d="M94 205 C77 207 74 184 91 179 C90 160 117 155 126 170 C143 161 158 171 156 187 C173 187 176 209 158 212 H94" class="icon"/>
<rect x="173" y="174" width="45" height="16" rx="5" class="icon"/><rect x="173" y="196" width="45" height="16" rx="5" class="icon"/>
<path d="M64 221 H88 L94 228 H122 V252 H64 Z" fill="#d4eddc" stroke="#3a7796" stroke-width="3" stroke-linejoin="round"/>
<text x="145" y="278" text-anchor="middle" class="head">Your repositories</text>
<text x="145" y="301" text-anchor="middle" class="tiny">Cloud · SaaS · fileshares</text>

<g filter="url(#shadow)"><rect x="30" y="363" width="230" height="150" rx="24" fill="#f5f1fc" stroke="#ac9bc9" stroke-width="2"/></g>
<rect x="106" y="386" width="78" height="48" rx="8" class="icon"/><path d="M99 443 H191 M127 400 L118 410 L127 420 M163 400 L172 410 L163 420 M149 399 L141 421" class="icon"/>
<text x="145" y="474" text-anchor="middle" class="head">Your applications</text>
<text x="145" y="498" text-anchor="middle" class="tiny">Internal teams · external partners</text>

<!-- Connector and Application access paths. -->
<path d="M263 228 H393" class="line" marker-end="url(#arrow)"/>
<rect x="279" y="166" width="102" height="43" rx="16" fill="#d4eddc"/>
<text x="330" y="193" text-anchor="middle" class="small">Connectors</text>
<path d="M263 438 H393" class="line" marker-end="url(#arrow)"/>
<text x="329" y="412" text-anchor="middle" class="small">Gateway access</text>
<text x="329" y="465" text-anchor="middle" class="tiny">Application grants</text>

<!-- The security hub, with a shield and three simple stages. -->
<g filter="url(#shadow)"><rect x="399" y="139" width="391" height="383" rx="32" fill="#e9f5fc" stroke="#4094bf" stroke-width="3"/></g>
<path d="M594 162 L623 175 V197 Q619 215 594 230 Q569 215 565 197 V175 Z" fill="#fff" stroke="#4094bf" stroke-width="3"/>
<path d="M582 193 L591 202 L608 182" fill="none" stroke="#4094bf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="594" y="260" text-anchor="middle" class="title">DSX-Connect</text>
<text x="594" y="285" text-anchor="middle" class="small">Three ways to protect your files</text>

<rect x="427" y="314" width="335" height="49" rx="16" fill="#fff"/>
<circle cx="456" cy="338" r="10" class="icon"/><path d="M463 345 L471 353" class="icon"/>
<text x="485" y="334" class="label">Monitoring</text>
<text x="485" y="353" class="tiny">Evaluate new and changed files</text>
<rect x="427" y="374" width="335" height="49" rx="16" fill="#fff"/>
<path d="M447 391 H469 M447 400 H469 M453 385 V407 M463 394 V413" class="icon"/>
<text x="485" y="394" class="label">Full Scans</text>
<text x="485" y="413" class="tiny">Evaluate existing repository content</text>
<rect x="427" y="434" width="335" height="49" rx="16" fill="#fff"/>
<path d="M448 460 L455 467 L469 449" class="icon"/>
<text x="485" y="454" class="label">File Gateway</text>
<text x="485" y="473" class="tiny">Upload through enterprise controls</text>
<text x="594" y="505" text-anchor="middle" class="tiny">DSXA scanning · security policy · tracked outcomes</text>

<!-- Deep Instinct products supporting the three workflows. -->
<path d="M793 245 H855" class="line" marker-end="url(#arrow)"/>
<path d="M793 443 H855" class="line" marker-end="url(#arrow)"/>
<g filter="url(#shadow)"><rect x="865" y="155" width="305" height="171" rx="24" fill="#101f42" stroke="#415b8b" stroke-width="2"/></g>
<path d="M899 181 H930 L944 195 V235 H899 Z M930 181 V196 H944" fill="#101f42" stroke="#a8c7f0" stroke-width="3" stroke-linejoin="round"/>
<circle cx="950" cy="226" r="17" fill="#a8c7f0"/><path d="M942 226 L948 232 L958 219" fill="none" stroke="#101f42" stroke-width="3" stroke-linecap="round"/>
<text x="1017" y="269" text-anchor="middle" class="head" style="fill:#ffffff">DSX for Applications</text>
<text x="1017" y="294" text-anchor="middle" class="small" style="fill:#d0ddf0">Deep Instinct malware scanning</text>
<g filter="url(#shadow)"><rect x="865" y="365" width="305" height="148" rx="24" fill="#101f42" stroke="#415b8b" stroke-width="2"/></g>
<circle cx="915" cy="408" r="18" fill="#101f42" stroke="#a8c7f0" stroke-width="3"/><path d="M928 421 L941 434 M905 408 H925 M915 398 V418" fill="none" stroke="#a8c7f0" stroke-width="3" stroke-linecap="round"/>
<text x="1043" y="421" text-anchor="middle" class="head" style="fill:#ffffff">DIANNA</text>
<text x="1017" y="467" text-anchor="middle" class="small" style="fill:#d0ddf0">Follow-up analysis and insights</text>
<text x="1017" y="491" text-anchor="middle" class="tiny" style="fill:#a8bfdf">Optional, when requested</text>

</svg>
