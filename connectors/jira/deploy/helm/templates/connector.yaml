apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.fullnameOverride }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: {{ .Values.fullnameOverride }}
  template:
    metadata:
      labels:
        app: {{ .Values.fullnameOverride }}
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: {{ .Values.fullnameOverride }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "connectors.jira.start"]
          ports:
            - name: http
              containerPort: 8680
          env:
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: DSXCONNECTOR_JIRA_API_TOKEN_FILE, value: "/run/secrets/jira/token"}
            - {name: DSXCONNECTOR_JIRA_CHECKPOINT_FILE, value: "/app/data/jira-monitor.sqlite3"}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - {name: token, mountPath: /run/secrets/jira, readOnly: true}
            - {name: data, mountPath: /app/data}
          readinessProbe:
            httpGet: {path: /jira-connector/readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /jira-connector/healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: token
          secret: {secretName: {{ .Values.existingTokenSecret }}}
        - name: data
          persistentVolumeClaim: {claimName: {{ .Values.persistence.claimName }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnameOverride }}
  namespace: {{ .Release.Namespace }}
spec:
  selector: {app: {{ .Values.fullnameOverride }}}
  ports:
    - {name: http, port: 8680, targetPort: http}

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.claimName }}
  namespace: {{ .Release.Namespace }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
