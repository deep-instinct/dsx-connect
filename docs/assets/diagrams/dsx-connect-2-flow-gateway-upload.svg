<text class="chip" x="330" y="287" text-anchor="middle">Filesystem</text>
<rect x="254" y="306" width="152" height="32" rx="8" fill="#ffffff" stroke="#66bb6a" stroke-width="1" stroke-dasharray="4 3"/>
<text class="chip" x="330" y="327" text-anchor="middle">More connectors</text>
