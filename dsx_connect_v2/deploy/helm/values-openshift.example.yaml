# Full-stack DSX-Connect 2 profile for OpenShift (restricted-v2 SCC).
# OpenShift runs pods with a random UID, so containers must not require root
# and Postgres must initialize into a subdirectory of its volume.

env:
  DSX_CONNECT_V2__ENVIRONMENT: "openshift"
  DSX_CONNECT_V2__CONTROL_PLANE_BACKEND: "postgres"
  DSX_CONNECT_V2__JOB_BUS_BACKEND: "rabbitmq"
  DSX_CONNECT_V2_POSTGRES__AUTO_APPLY_SCHEMA: "true"
  DSX_CONNECT_V2_POSTGRES__URL: "postgresql://dsx:dsx@dsx-connect-postgres:5432/dsx_connect_2"
  DSX_CONNECT_V2_RABBITMQ__URL: "amqp://dsx:dsx@dsx-connect-rabbitmq:5672/%2F"
  DSX_CONNECT_V2_SCANNER__MODE: "dsxa"
  # In-cluster DSXA REST service, e.g. http://rest-7.<dsxa-namespace>.svc.cluster.local:80
  DSX_CONNECT_V2_SCANNER__BASE_URL: "http://<dsxa-service>.<dsxa-namespace>.svc.cluster.local:80"
  DSX_CONNECT_V2_READERS__DEFAULT_STRATEGY: "proxy"

# Satisfies the restricted-v2 SCC without privileged containers.
containerSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

postgresql:
  enabled: true
  # The random UID cannot chmod the volume mount point, so initdb must own a subdirectory.
  dataDir: /var/lib/postgresql/data/pgdata
  persistence:
    # false uses emptyDir and loses data when the pod is deleted.
    enabled: false

rabbitmq:
  enabled: true
  persistence:
    enabled: false

workers:
  relay:
    enabled: true
    args: ["--batch-size", "100", "--poll-interval-seconds", "0.25", "--max-active-scan-items", "1000"]
  scan:
    enabled: true
    args: ["--prefetch-count", "10"]
  policy:
    enabled: true
    args: ["--prefetch-count", "100"]
  remediation:
    enabled: true
    args: ["--prefetch-count", "5"]
  resultSink:
    enabled: true
    args: ["--prefetch-count", "10"]
  dianna:
    enabled: true
    args: ["--prefetch-count", "5"]
