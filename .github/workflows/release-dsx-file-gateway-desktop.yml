name: Release DSX File Gateway Desktop (Electron)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish artifacts to a GitHub Release."
        required: true
        type: boolean
        default: false
  push:
    tags:
      - "dsx-file-gateway-desktop-*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version files
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          package_dir = pathlib.Path("dsx_file_gateway_desktop")
          package_json = json.loads((package_dir / "package.json").read_text())
          lock = json.loads((package_dir / "package-lock.json").read_text())
          version = package_json["version"]
          lock_versions = {lock.get("version"), lock.get("packages", {}).get("", {}).get("version")}
          lock_versions.discard(None)
          if lock_versions != {version}:
              raise SystemExit(f"Version mismatch: package.json={version}, package-lock.json={lock_versions}")

          release_tag = f"dsx-file-gateway-desktop-{version}"
          if os.environ.get("GITHUB_EVENT_NAME") == "push" and os.environ.get("GITHUB_REF_NAME") != release_tag:
              raise SystemExit(f"Tag mismatch: pushed {os.environ.get('GITHUB_REF_NAME')}, expected {release_tag}")

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a") as fh:
              fh.write(f"version={version}\n")
              fh.write(f"release_tag={release_tag}\n")
          PY

  desktop-check:
    runs-on: ubuntu-latest
    needs: resolve-version
    defaults:
      run:
        working-directory: dsx_file_gateway_desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dsx_file_gateway_desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run desktop syntax check
        run: npm run check

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    needs: desktop-check
    defaults:
      run:
        working-directory: dsx_file_gateway_desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dsx_file_gateway_desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build macOS ${{ matrix.arch }} app
        run: npm run build:mac -- --${{ matrix.arch }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsx-file-gateway-desktop-macos-${{ matrix.arch }}
          path: |
            dsx_file_gateway_desktop/dist/*.dmg
            dsx_file_gateway_desktop/dist/*.zip

  build-linux:
    runs-on: ubuntu-latest
    needs: desktop-check
    defaults:
      run:
        working-directory: dsx_file_gateway_desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dsx_file_gateway_desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Linux app
        run: npm run build:linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsx-file-gateway-desktop-linux
          path: |
            dsx_file_gateway_desktop/dist/*.AppImage
            dsx_file_gateway_desktop/dist/*.deb

  build-windows:
    runs-on: windows-latest
    needs: desktop-check
    defaults:
      run:
        working-directory: dsx_file_gateway_desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dsx_file_gateway_desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Windows app
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsx-file-gateway-desktop-windows
          path: |
            dsx_file_gateway_desktop/dist/*.exe
            dsx_file_gateway_desktop/dist/*.msi

  publish-release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/dsx-file-gateway-desktop-')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs:
      - resolve-version
      - build-macos
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: dsx-file-gateway-desktop-macos-x64
          path: dist/release

      - name: Download macOS Apple Silicon artifacts
        uses: actions/download-artifact@v4
        with:
          name: dsx-file-gateway-desktop-macos-arm64
          path: dist/release

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: dsx-file-gateway-desktop-linux
          path: dist/release

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: dsx-file-gateway-desktop-windows
          path: dist/release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-version.outputs.release_tag }}
          files: dist/release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
