{{- range $workerName, $worker := .Values.workers }}
{{- if $worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dsx-connect.fullname" $ }}-{{ $workerName | kebabcase }}
  labels:
    {{- include "dsx-connect.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $workerName | kebabcase }}
spec:
  replicas: {{ $worker.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $workerName | kebabcase }}
  template:
    metadata:
      labels:
        {{- include "dsx-connect.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $workerName | kebabcase }}
    spec:
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range $.Values.imagePullSecrets }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $workerName | kebabcase }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $.Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            {{- toYaml $worker.command | nindent 12 }}
          {{- if $worker.args }}
          args:
            {{- toYaml $worker.args | nindent 12 }}
          {{- end }}
          env:
            {{- include "dsx-connect.env" $ | nindent 12 }}
            {{- if $.Values.gateway.uploadCache.enabled }}
            - name: DSX_CONNECT_NG_GATEWAY__UPLOAD_CACHE_DIR
              value: {{ printf "%s/uploads" $.Values.gateway.uploadCache.mountPath | quote }}
            {{- end }}
          {{- if $.Values.envSecretRefs }}
          envFrom:
            {{- range $.Values.envSecretRefs }}
            - secretRef:
                name: {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- if $.Values.gateway.uploadCache.enabled }}
          volumeMounts:
            - name: gateway-upload-cache
              mountPath: {{ $.Values.gateway.uploadCache.mountPath | quote }}
          {{- end }}
      {{- if $.Values.gateway.uploadCache.enabled }}
      volumes:
        - name: gateway-upload-cache
          {{- if $.Values.gateway.uploadCache.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $.Values.gateway.uploadCache.existingClaim | quote }}
          {{- else if $.Values.gateway.uploadCache.createClaim }}
          persistentVolumeClaim:
            claimName: {{ include "dsx-connect.fullname" $ }}-gateway-upload-cache
          {{- else if $.Values.gateway.uploadCache.hostPath }}
          hostPath:
            path: {{ $.Values.gateway.uploadCache.hostPath | quote }}
            type: DirectoryOrCreate
          {{- else }}
          emptyDir:
            {{- if $.Values.gateway.uploadCache.sizeLimit }}
            sizeLimit: {{ $.Values.gateway.uploadCache.sizeLimit | quote }}
            {{- end }}
          {{- end }}
      {{- end }}
{{- end }}
{{- end }}
