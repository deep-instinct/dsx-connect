<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 680" width="1240" height="680" role="img" aria-labelledby="t d"><title id="t">DSX-Connect 2 gateway: direct upload workflow</title><desc id="d">Application uploads files to the gateway API. API checks the app's grants and caches the upload. Job, items and outbox committed to PostgreSQL. Relay queues the scan in RabbitMQ. Scan worker reads the cached file. DSXA returns a verdict. Policy decides; allowed files go to the destination.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker><marker id="arrow-hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/></marker><style>text { font-family: Roboto, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2933; }.h { font-size: 15px; font-weight: 600; } .h-sm { font-size: 14px; font-weight: 600; }.sub { font-size: 11.5px; fill: #52606d; } .chip { font-size: 12.5px; font-weight: 500; }.lbl { font-size: 10.5px; fill: #52606d; } .lbl-hl { font-size: 10.5px; font-weight: 600; fill: #ef6c00; }.step { font-size: 12px; } .badge-t { font-size: 11px; font-weight: 700; fill: #ffffff; }.core-t { font-size: 16px; font-weight: 700; fill: #0277bd; }</style></defs>
