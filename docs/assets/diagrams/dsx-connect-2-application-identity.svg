<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">DSX-Connect Application identity and attribution</title>
<desc id="desc">An operator defines an Application record. A real caller presents a credential that resolves to this record. Its grants authorize file requests and its attribution follows jobs, scanning, and results. Connectors provide destination access.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ef6c00"/></marker></defs>
<rect width="1120" height="660" rx="12" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#1f2933}.title{font-size:25px;font-weight:700}.heading{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#52606d}</style>
<text x="30" y="40" class="title" text-anchor="start">Application identity and attribution</text>
<text x="30" y="65" class="body" text-anchor="start">Register an Application to use DSX-Connect’s File Gateway capability.</text>
<rect x="340" y="125" width="440" height="340" rx="12" fill="#eef7fd" stroke="#0288d1" stroke-width="1.5"/>
<text x="560.0" y="154" class="heading" text-anchor="middle">DSX-Connect Application</text>
<text x="560.0" y="179" class="body" text-anchor="middle">A registered identity and access configuration</text>
<rect x="358" y="198" width="404" height="68" rx="12" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/>
<text x="560.0" y="227" class="heading" text-anchor="middle">Identity bindings</text>
<text x="560.0" y="252" class="body" text-anchor="middle">Map a credential to this Application</text>
<rect x="358" y="282" width="404" height="68" rx="12" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/>
<text x="560.0" y="311" class="heading" text-anchor="middle">Access grants</text>
<text x="560.0" y="336" class="body" text-anchor="middle">Allowed actions, destinations, path prefixes</text>
<rect x="358" y="366" width="404" height="78" rx="12" fill="#ffffff" stroke="#0288d1" stroke-width="1.5"/>
<text x="560.0" y="395" class="heading" text-anchor="middle">Attribution defaults</text>
<text x="560.0" y="420" class="body" text-anchor="middle">Tenant · business unit · cost center</text>
<text x="560.0" y="441" class="body" text-anchor="middle">Application ID · DSXA protected entity</text>
<rect x="30" y="140" width="245" height="108" rx="12" fill="#f5f6f8" stroke="#7b8794" stroke-width="1.5"/>
<text x="152.5" y="169" class="heading" text-anchor="middle">Real caller</text>
<text x="152.5" y="194" class="body" text-anchor="middle">Application · service · user</text>
<text x="152.5" y="215" class="body" text-anchor="middle">Presents a credential</text>
<rect x="30" y="318" width="245" height="108" rx="12" fill="#edf7ee" stroke="#2e7d32" stroke-width="1.5"/>
<text x="152.5" y="347" class="heading" text-anchor="middle">Operator</text>
<text x="152.5" y="372" class="body" text-anchor="middle">Registers the Application</text>
<text x="152.5" y="393" class="body" text-anchor="middle">Assigns bindings and grants</text>
<rect x="845" y="140" width="245" height="108" rx="12" fill="#fff8e1" stroke="#f57f17" stroke-width="1.5"/>
<text x="967.5" y="169" class="heading" text-anchor="middle">Authenticate &amp; Authorize</text>
<text x="967.5" y="194" class="body" text-anchor="middle">Resolves Application identity</text>
<text x="967.5" y="215" class="body" text-anchor="middle">Checks requested access</text>
<rect x="845" y="318" width="245" height="108" rx="12" fill="#edf7ee" stroke="#2e7d32" stroke-width="1.5"/>
<text x="967.5" y="347" class="heading" text-anchor="middle">Destination access</text>
<text x="967.5" y="372" class="body" text-anchor="middle">Protected scope + connector</text>
<text x="967.5" y="393" class="body" text-anchor="middle">Repository permissions</text>
<rect x="340" y="524" width="750" height="105" rx="12" fill="#eef7fd" stroke="#0288d1" stroke-width="1.5"/>
<text x="715.0" y="553" class="heading" text-anchor="middle">File Gateway workflow</text>
<text x="715.0" y="578" class="body" text-anchor="middle">Accept files → scan / DSXA → policy → delivery + results</text>
<text x="715.0" y="599" class="body" text-anchor="middle">Application context follows the work and remains available to operators</text>
<polyline points="275,185 307,185 307,230 358,230" fill="none" stroke="#ef6c00" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="305" y="164" class="small" text-anchor="middle">identify</text>
<polyline points="275,370 340,370" fill="none" stroke="#ef6c00" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="780,230 810,230 810,194 845,194" fill="none" stroke="#ef6c00" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="814" y="166" class="small" text-anchor="middle">authorize</text>
<polyline points="967,248 967,318" fill="none" stroke="#ef6c00" stroke-width="2.5" marker-end="url(#arrow)"/>
<polyline points="967,426 967,524" fill="none" stroke="#ef6c00" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="975" y="477" class="small" text-anchor="start">requested target</text>
<polyline points="560,465 560,524" fill="none" stroke="#ef6c00" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="548" y="496" class="small" text-anchor="end">attach attribution</text>
<text x="30" y="492" class="small" text-anchor="start">Credential binding today:</text>
<text x="30" y="515" class="body" text-anchor="start">Static bearer token</text>
<text x="30" y="552" class="small" text-anchor="start">Planned identity integration:</text>
<text x="30" y="575" class="body" text-anchor="start">Entra / Okta / OIDC tokens</text>
</svg>
